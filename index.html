```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biano Web Rádio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #111827, #1e3a8a);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        .logo {
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #38bdf8;
        }

        .subtitle {
            color: #d1d5db;
            margin-bottom: 30px;
        }

        .radio-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 35px 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .radio-icon {
            font-size: 70px;
            margin-bottom: 15px;
        }

        h2 {
            margin-bottom: 10px;
        }

        .status {
            color: #4ade80;
            margin-bottom: 25px;
            font-weight: bold;
        }

        audio {
            width: 100%;
            margin-bottom: 25px;
        }

        .social {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .social a {
            color: #fff;
            text-decoration: none;
            background: #2563eb;
            padding: 10px 18px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .social a:hover {
            background: #38bdf8;
            color: #111827;
        }

        footer {
            margin-top: 25px;
            color: #9ca3af;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">BIANO</div>

        <p class="subtitle">Web Rádio — Música, informação e entretenimento</p>

        <div class="radio-box">

            <div class="radio-icon">📻</div>

            <h2>Biano Web Rádio</h2>

            <p class="status">● AO VIVO</p>

            <!--
                Substitua o endereço abaixo pela URL do streaming
                da sua rádio.
            -->
            <audio controls autoplay>
                <source src="https://SEU-SERVIDOR-DE-STREAMING/stream" type="audio/mpeg">
                Seu navegador não suporta o player de áudio.
            </audio>

            <p>Ouça a Biano Web Rádio onde estiver!</p>

            <div class="social">
                <a href="#" target="_blank">Instagram</a>
                <a href="#" target="_blank">Facebook</a>
                <a href="#" target="_blank">WhatsApp</a>
            </div>

        </div>

        <footer>
            © 2026 Biano Web Rádio — Todos os direitos reservados.
        </footer>

    </div>

</body>
</html>
